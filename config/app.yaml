# Non-secret application settings shared by every component.
# Environment variables (.env) override values here: secrets and hostnames live in .env.

sim_clock:
  day_seconds: 300            # 1 simulated day = 5 real minutes (SIM_DAY_SECONDS)
  epoch: "2026-09-28T00:00:00+00:00"   # sim_day 0 starts here (SIM_EPOCH)

patients:
  count: 15
  id_prefix: "P"              # P001 .. P015

vitals_simulator:
  min_interval_seconds: 2
  max_interval_seconds: 5
  abnormal_spike_probability: 0.03
  random_seed: 42

lab_simulator:
  tests: [potassium, creatinine, haemoglobin, wbc, crp, lactate]
  missing_result_probability: 0.05    # one test missing for a patient
  missing_patient_probability: 0.10   # no labs at all for a patient -> LAB_UNAVAILABLE
  out_of_range_probability: 0.12      # a result outside its reference range
  far_out_of_range_share: 0.30        # share of those beyond 1.5x the limit
  abnormal_patients: [P007]           # always has high CRP and lactate (matches the vitals demo)
  random_seed: 7
  landing_dir: /data/landing/labs
  metrics_port: 8002                  # /metrics while running as a service (Prometheus scrapes it)

kafka:
  bootstrap_servers: localhost:9094   # host default; containers get kafka:9092 (KAFKA_BOOTSTRAP_INTERNAL)
  topics:
    vitals: patient-vitals
    dlq: vitals-dlq
    alerts: patient-alerts

# Host defaults for local runs; containers override host/port/credentials from .env.
postgres:
  host: localhost             # POSTGRES_HOST (postgres inside Docker)
  port: 5432                  # POSTGRES_PORT
  db: ward                    # POSTGRES_DB
  user: ward                  # POSTGRES_USER
  password: ward_dev_pw       # POSTGRES_PASSWORD (local dev only)

streaming:
  window_duration: "2 minutes"
  slide_duration: "30 seconds"
  watermark: "1 minute"
  trigger_interval: "10 seconds"

paths:
  lake_vitals: /data/lake/vitals
  checkpoints: /data/checkpoints
  landing_labs: /data/landing/labs
  reports: /data/reports

health:
  no_vitals_alert_seconds: 30
  lab_file_deadline_seconds: 60   # after the sim-day boundary
