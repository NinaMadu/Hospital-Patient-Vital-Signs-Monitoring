# Prometheus scrape config (monitoring profile). Owner: Member C.
global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Metrics pushed by Spark jobs (StreamingQueryListener) and short-lived batch tasks.
  - job_name: pushgateway
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]

  # Kafka topic offsets and consumer-group lag.
  - job_name: kafka-exporter
    static_configs:
      - targets: ["kafka-exporter:9308"]

  # FastAPI serving layer (/metrics): request metrics + serving-store freshness from Postgres.
  - job_name: api
    static_configs:
      - targets: ["api:8000"]

  # Alert consumer (patient-alerts -> vital_alerts).
  - job_name: alert-consumer
    static_configs:
      - targets: ["alert-consumer:8001"]

  # Bedside simulator / Kafka producer (A7).
  - job_name: vital-producer
    static_configs:
      - targets: ["vital-producer:8001"]

  # Add the lab feed here once it exposes metrics (B10).
  # Lab file simulator (B10): files written, newest sim day, time of the newest file.
  - job_name: lab-simulator
    static_configs:
      - targets: ["lab-simulator:8002"]

  # Add the vital simulator here once it exposes /metrics (A7).
