# Ward Vitals pipeline: local development stack.
#
#   docker compose up -d                        core stack (Kafka, Spark, Airflow, Postgres, API)
#   docker compose --profile monitoring up -d   + Prometheus, Pushgateway, kafka-exporter, Grafana
#
# Pipeline services (vital simulator, lab simulator, Spark streaming app, alert consumer)
# are added here by their owners as each slice is built (see docs/PROJECT_PLAN.md).

x-spark-common: &spark-common
  image: ward-vitals/spark:3.5.5
  build:
    context: .
    dockerfile: docker/spark/Dockerfile
  env_file: .env
  volumes:
    - ./:/opt/project:ro
    - lake:/data/lake
    - checkpoints:/data/checkpoints
    - ./data/landing:/data/landing
  depends_on:
    init-dirs:
      condition: service_completed_successfully
  restart: unless-stopped

services:

  # ---------------------------------------------------------------- setup --
  # Makes the shared Spark volumes writable for every container user
  # (spark = uid 185, airflow = uid 50000).
  init-dirs:
    image: busybox:1.36
    command: ["sh", "-c", "mkdir -p /data/lake /data/checkpoints && chmod -R 0777 /data/lake /data/checkpoints"]
    volumes:
      - lake:/data/lake
      - checkpoints:/data/checkpoints
    restart: "no"

  # ------------------------------------------------------------ ingestion --
  kafka:
    image: apache/kafka:3.9.0
    hostname: kafka
    ports:
      - "9094:9094"          # host access: localhost:9094
    environment:
      CLUSTER_ID: "wardVitalsKraft0001xxA"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"   # topics are created explicitly by kafka-init
      KAFKA_LOG_RETENTION_HOURS: 168             # 7 days of replayable history
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  kafka-init:
    image: apache/kafka:3.9.0
    env_file: .env
    entrypoint: ["/bin/bash", "/init/create_topics.sh"]
    volumes:
      - ./kafka/init:/init:ro
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: ward-vitals
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "false"
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # Bedside vitals simulator -> patient-vitals (Member A).
  # Demo scenario:  docker compose run --rm vital-producer python -m simulators.vital_producer.main --scenario spike --patient P007
  vital-producer:
    image: ward-vitals/python-app:dev
    build:
      context: .
      dockerfile: docker/python/Dockerfile
    command: ["python", "-m", "simulators.vital_producer.main"]
    env_file: .env
    volumes:
      - ./:/opt/project:ro
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # ----------------------------------------------------------- processing --
  spark-master:
    <<: *spark-common
    hostname: spark-master
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    environment:
      SPARK_DAEMON_MEMORY: 512m
    ports:
      - "8090:8080"          # Spark master UI
      - "7077:7077"

  spark-worker:
    <<: *spark-common
    hostname: spark-worker
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    environment:
      SPARK_DAEMON_MEMORY: 512m
      SPARK_WORKER_CORES: ${SPARK_WORKER_CORES:-4}
      SPARK_WORKER_MEMORY: ${SPARK_WORKER_MEMORY:-2g}
    ports:
      - "8081:8081"          # Spark worker UI
    depends_on:
      init-dirs:
        condition: service_completed_successfully
      spark-master:
        condition: service_started

  # Speed layer: one long-running Spark app with Q1 (A), Q2 (B) and Q3 (C).
  # The driver runs here (client mode); executors run on spark-worker and connect back to it.
  spark-streaming:
    <<: *spark-common
    hostname: spark-streaming
    command: ["/opt/spark/bin/spark-submit",
              "--conf", "spark.driver.host=spark-streaming",
              "/opt/project/spark/streaming/app.py"]
    ports:
      - "4040:4040"          # Spark UI of the streaming app (Structured Streaming tab)
    depends_on:
      init-dirs:
        condition: service_completed_successfully
      spark-master:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  # --------------------------------------------------------- orchestration --
  # Single-container Airflow (scheduler + webserver + triggerer) with LocalExecutor.
  # Its Spark driver runs here in client mode, so it mounts the same data paths as Spark.
  airflow:
    image: ward-vitals/airflow:2.10.5
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
    hostname: airflow
    # A container restart (e.g. Docker Desktop restarting) keeps the old webserver pid file,
    # and the webserver then refuses to start. Remove it before launching.
    command: ["bash", "-c", "rm -f /opt/airflow/airflow-webserver*.pid && exec airflow standalone"]
    env_file: .env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@postgres:5432/${AIRFLOW_DB}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL: 10
      AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: 20
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
      AIRFLOW_CONN_SPARK_DEFAULT: '{"conn_type": "spark", "host": "spark://spark-master", "port": 7077}'
      AIRFLOW_CONN_WARD_POSTGRES: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    ports:
      - "8080:8080"          # Airflow UI
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/plugins:/opt/airflow/plugins
      - airflow-logs:/opt/airflow/logs
      - ./:/opt/project:ro
      - lake:/data/lake
      - checkpoints:/data/checkpoints
      - ./data/landing:/data/landing
      - ./data/reports:/data/reports
    depends_on:
      init-dirs:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      spark-master:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s
    restart: unless-stopped

  # -------------------------------------------------------------- storage --
  postgres:
    image: postgres:16.4-alpine
    env_file: .env
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # -------------------------------------------------------------- serving --
  api:
    image: ward-vitals/python-app:dev
    build:
      context: .
      dockerfile: docker/python/Dockerfile
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./:/opt/project:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:           # /health answers 503 while Postgres is unreachable
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # patient-alerts -> vital_alerts, consumer group ward-alert-consumer (Member C).
  # Metrics for Prometheus: http://localhost:8001/metrics
  alert-consumer:
    image: ward-vitals/python-app:dev
    build:
      context: .
      dockerfile: docker/python/Dockerfile
    command: ["python", "-m", "api.alert_consumer"]
    env_file: .env
    ports:
      - "8001:8001"
    volumes:
      - ./:/opt/project:ro
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # -------------------------------------------- observability (profile) --
  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["monitoring"]
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    restart: unless-stopped

  pushgateway:
    image: prom/pushgateway:v1.10.0
    profiles: ["monitoring"]
    ports:
      - "9091:9091"
    restart: unless-stopped

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.8.0
    profiles: ["monitoring"]
    command: ["--kafka.server=kafka:9092"]
    ports:
      - "9308:9308"
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    profiles: ["monitoring"]
    env_file: .env
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  kafka-data:
  pg-data:
  lake:
  checkpoints:
  airflow-logs:
  prometheus-data:
  grafana-data:
