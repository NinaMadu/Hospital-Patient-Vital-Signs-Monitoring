# Shared by every Spark app (streaming app in the spark image, batch jobs submitted from Airflow).
# SPARK_CONF_DIR points here in both images.

spark.master                          spark://spark-master:7077

# Resource caps: the long-running streaming app and a daily batch job must fit on one
# worker (SPARK_WORKER_CORES=4, SPARK_WORKER_MEMORY=2g) at the same time.
spark.cores.max                       2
spark.executor.cores                  2
spark.executor.memory                 768m
spark.driver.memory                   768m
spark.sql.shuffle.partitions          6

# Kafka connector + PostgreSQL JDBC driver, baked into both images.
spark.driver.extraClassPath           /opt/extra-jars/*
spark.executor.extraClassPath         /opt/extra-jars/*

spark.sql.session.timeZone            UTC
spark.sql.streaming.metricsEnabled    true
spark.ui.prometheus.enabled           true
